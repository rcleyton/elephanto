name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Brakeman
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Importmap audit
        run: |
          for attempt in 1 2 3; do
            output="$(bin/importmap audit 2>&1)"
            status=$?
            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! printf '%s\n' "$output" | grep -q "Unexpected transport error"; then
              exit "$status"
            fi

            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi

            sleep 5
          done

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: RuboCop
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elephanto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      CI: true
      RAILS_ENV: test
      APP_HOST: app.lvh.me
      APP_PROTOCOL: http
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      ELEPHANTO_USERNAME: postgres
      ELEPHANTO_PASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/elephanto_test

    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run tests
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          bin/rails test
          bin/rails test:system

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tmp/screenshots
          if-no-files-found: ignore
