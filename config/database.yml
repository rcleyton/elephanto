default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV["ELEPHANTO_USERNAME"] %>
  password: <%= ENV["ELEPHANTO_PASSWORD"] %>
  host: localhost

development:
  <<: *default
  database: elephanto_development

test:
  <<: *default
  database: elephanto_test

production:
  primary: &primary_production
    <<: *default
    database: elephanto_production
    username: <%= ENV["ELEPHANTO_USERNAME"] %>
    password: <%= ENV["ELEPHANTO_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: elephanto_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: elephanto_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: elephanto_production_cable
    migrations_paths: db/cable_migrate
